server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/subscriptiq}"
    username: "${DB_USER:subscriptiq}"
    password: "${DB_PASSWORD:leela}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  admin-password: ${ADMIN_PASSWORD:Admin@123}
  staff-password: ${STAFF_PASSWORD:Staff@123}
  invoice-due-days: ${INVOICE_DUE_DAYS:14}